<!DOCTYPE html>
<html>
<head>

    <title>Analytics Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{
            background:#eef2ff;
            font-family:Arial, sans-serif;
        }

        .dashboard-wrapper{
            width:95%;
            max-width:1400px;
            margin:30px auto;
        }

        .topbar{
            background:linear-gradient(90deg,#4f46e5,#5b21b6);
            color:white;
            padding:25px 35px;
            border-radius:20px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:30px;
        }

        .topbar h1{
            font-size:28px;
            font-weight:600;
        }

        .nav-links{
            margin-bottom:25px;
        }

        .nav-links a{
            text-decoration:none;
            background:#4f46e5;
            color:white;
            padding:12px 18px;
            border-radius:10px;
            margin-right:10px;
            font-weight:500;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:20px;
            margin-bottom:30px;
        }

        .card{
            background:white;
            padding:30px;
            border-radius:18px;
            box-shadow:0 5px 20px rgba(0,0,0,0.08);
            text-align:center;
        }

        .card h2{
            font-size:42px;
            color:#4f46e5;
            margin-bottom:10px;
        }

        .card p{
            color:#555;
            font-size:16px;
        }

        .charts{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:25px;
            margin-bottom:25px;
        }

        .chart-box{
            background:white;
            padding:25px;
            border-radius:18px;
            box-shadow:0 5px 20px rgba(0,0,0,0.08);
        }

        .chart-box h3{
            margin-bottom:20px;
            color:#333;
        }

        .bottom-chart{
            width:50%;
            margin:auto;
            background:white;
            padding:25px;
            border-radius:18px;
            box-shadow:0 5px 20px rgba(0,0,0,0.08);
        }

        @media(max-width:900px){

            .cards{
                grid-template-columns:1fr 1fr;
            }

            .charts{
                grid-template-columns:1fr;
            }

            .bottom-chart{
                width:100%;
            }
        }

    </style>

</head>

<body>

<div class="dashboard-wrapper">

    <div class="topbar">

        <h1>Analytics Dashboard</h1>

        <div>⋮</div>

    </div>

    <div class="nav-links">

        <a href="/">Booking</a>

        <a href="/dashboard">Dashboard</a>

    </div>

    <div class="cards">

        <div class="card">
            <h2>{{ total }}</h2>
            <p>Total Bookings</p>
        </div>

        <div class="card">
            <h2>{{ approved }}</h2>
            <p>Approved</p>
        </div>

        <div class="card">
            <h2>{{ rejected }}</h2>
            <p>Rejected</p>
        </div>

        <div class="card">
            <h2>{{ pending }}</h2>
            <p>Pending</p>
        </div>

    </div>

    <div class="charts">

        <div class="chart-box">

            <h3>Venue Usage</h3>

            <canvas id="barChart"></canvas>

        </div>

        <div class="chart-box">

            <h3>Booking Status</h3>

            <canvas id="pieChart"></canvas>

        </div>

    </div>

    <div class="bottom-chart">

        <h3 style="text-align:center; margin-bottom:20px;">
            Approval vs Rejection
        </h3>

        <canvas id="doughnutChart"></canvas>

    </div>

</div>

<script>

    // BAR CHART

    const barChart = new Chart(
        document.getElementById('barChart'),
        {
            type:'bar',

            data:{
                labels:[
                    'Total',
                    'Approved',
                    'Rejected',
                    'Pending'
                ],

                datasets:[{
                    label:'Bookings',

                    data:[
                        {{ total }},
                        {{ approved }},
                        {{ rejected }},
                        {{ pending }}
                    ],

                    backgroundColor:[
                        '#4f46e5',
                        '#22c55e',
                        '#ef4444',
                        '#f59e0b'
                    ],

                    borderRadius:10
                }]
            },

            options:{
                responsive:true
            }
        }
    );


    // PIE CHART

    const pieChart = new Chart(
        document.getElementById('pieChart'),
        {
            type:'pie',

            data:{
                labels:[
                    'Approved',
                    'Rejected',
                    'Pending'
                ],

                datasets:[{
                    data:[
                        {{ approved }},
                        {{ rejected }},
                        {{ pending }}
                    ],

                    backgroundColor:[
                        '#22c55e',
                        '#ef4444',
                        '#f59e0b'
                    ]
                }]
            }
        }
    );


    // DOUGHNUT CHART

    const doughnutChart = new Chart(
        document.getElementById('doughnutChart'),
        {
            type:'doughnut',

            data:{
                labels:[
                    'Approved',
                    'Rejected'
                ],

                datasets:[{
                    data:[
                        {{ approved }},
                        {{ rejected }}
                    ],

                    backgroundColor:[
                        '#4f46e5',
                        '#ef4444'
                    ]
                }]
            }
        }
    );

</script>

</body>
</html>
